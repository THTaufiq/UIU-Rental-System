<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landlord Messages & Chat — UIU Student Rental System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div style="padding: 18px 20px 14px; border-bottom: 1px solid #E2E8F0;">
        <a href="../index.html" style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 34px; height: 34px; background: #2563EB; border-radius: 9px; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9 22 9 12 15 12 15 22" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div style="font-size: 14px; font-weight: 700; color: #0F172A; line-height: 1.1;">UIU Rental</div>
            <div style="font-size: 10px; color: #64748B; font-weight: 500;">Landlord Portal</div>
          </div>
        </a>
      </div>

      <div style="padding: 14px 20px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px;">
        <div id="landlord-sidebar-avatar" style="width: 38px; height: 38px; border-radius: 50%; background: #059669; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; flex-shrink: 0;">
          LL
        </div>
        <div style="overflow: hidden;">
          <div id="landlord-sidebar-name" style="font-size: 13px; font-weight: 700; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Landlord User</div>
          <div id="landlord-sidebar-email" style="font-size: 11px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">landlord@uiu.ac.bd</div>
          <span style="display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 700; background: rgba(5,150,105,0.1); color: #059669; border-radius: 99px; padding: 1px 8px;">
            Landlord
          </span>
        </div>
      </div>

      <nav style="padding: 10px; flex: 1;">
        <a href="landlord-dashboard.html" class="sidebar-link"><span>⊞</span><span>Dashboard</span></a>
        <a href="landlord-maintenance.html" class="sidebar-link"><span>🔧</span><span>Maintenance</span></a>
        <a href="landlord-chat.html" class="sidebar-link active"><span>💬</span><span>Chat</span></a>
        <a href="landlord-reports.html" class="sidebar-link"><span>📊</span><span>Reports</span></a>
        <a href="landlord-profile.html" class="sidebar-link"><span>👤</span><span>Profile</span></a>
        <a href="landlord-settings.html" class="sidebar-link"><span>⚙️</span><span>Settings</span></a>
      </nav>

      <div style="padding: 10px; border-top: 1px solid #E2E8F0;">
        <button onclick="logoutUser()" class="sidebar-link" style="color: #EF4444; width: 100%; border: none; background: none; text-align: left; cursor: pointer;">
          <span>🚪</span><span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- ── Main Content ── -->
    <div class="main-content">
      <header class="top-bar">
        <div style="display: flex; align-items: center; gap: 12px; margin-left: auto;">
          <a id="landlord-topbar-avatar" class="topbar-avatar" href="landlord-profile.html" style="width: 34px; height: 34px; border-radius: 50%; background: #059669; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; text-decoration: none;">LL</a>
        </div>
      </header>

      <main class="main-scroll-area fade-in" style="padding: 0; display: flex; flex-direction: column; height: calc(100vh - 61px);">
        <div style="display: flex; flex: 1; overflow: hidden;">
          
          <!-- Conversation Sidebar -->
          <div style="width: 320px; border-right: 1px solid #E2E8F0; background: #fff; display: flex; flex-direction: column;">
            <div style="padding: 18px 20px; border-bottom: 1px solid #E2E8F0;">
              <h2 style="font-size: 16px; font-weight: 700; color: #0F172A; margin: 0 0 10px;">Tenant Messages</h2>
              <input class="input-field" placeholder="Search tenants..." style="padding: 8px 12px; font-size: 13px;" id="search-tenant-input" onkeyup="filterConversations()">
            </div>
            
            <div style="overflow-y: auto; flex: 1;" id="conversations-list-container">
              <div style="padding: 20px; text-align: center; color: #64748B;">Loading conversations...</div>
            </div>
          </div>

          <!-- Active Message Feed Area -->
          <div style="flex: 1; display: flex; flex-direction: column; background: #F8FAFC;">
            
            <!-- Chat Header -->
            <div style="padding: 16px 24px; background: #fff; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center;">
              <div style="display: flex; gap: 12px; align-items: center;">
                <div id="active-chat-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: #2563EB; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">
                  LL
                </div>
                <div>
                  <div id="active-chat-name" style="font-size: 15px; font-weight: 700; color: #0F172A;">Select a Conversation</div>
                  <div id="active-chat-sub" style="font-size: 12px; color: #64748B; font-weight: 500;">Select a tenant conversation from the sidebar</div>
                </div>
              </div>
            </div>

            <!-- Messages Stream -->
            <div style="flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;" id="chat-messages-container">
              <div style="text-align: center; color: #94A3B8; margin-top: 40px;">Select a conversation to start chatting</div>
            </div>

            <!-- Chat Input Footer -->
            <div style="padding: 16px 24px; background: #fff; border-top: 1px solid #E2E8F0;">
              <form onsubmit="handleSendLandlordMessage(event)" style="display: flex; gap: 10px;">
                <input class="input-field" placeholder="Type a message to tenant..." id="landlord-chat-input" style="flex: 1;" autocomplete="off">
                <button type="submit" class="btn-primary" style="padding: 0 20px;">Send →</button>
              </form>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    let activeConversationId = null;
    let landlordConversations = [];
    let activeLandlordUserId = 0;
    let chatPollingInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadLandlordConversations();

      chatPollingInterval = setInterval(() => {
        if (activeConversationId) {
          loadMessages(activeConversationId, true);
        }
      }, 4000);
    });

    function loadLandlordConversations() {
      const container = document.getElementById('conversations-list-container');
      if (!container) return;

      fetch('../../backend/landlord/chat.php')
        .then(res => {
          if (res.status === 401 || res.status === 403) {
            window.location.href = 'login.html';
            return;
          }
          return res.json();
        })
        .then(result => {
          if (!result || !result.success) {
            container.innerHTML = `<div style="padding: 20px; text-align: center; color: #EF4444;">Failed to load conversations.</div>`;
            return;
          }

          if (result.current_user_id) {
            activeLandlordUserId = parseInt(result.current_user_id);
          }

          landlordConversations = result.data || [];
          renderConversationsList(landlordConversations);

          // Check URL query param for specific tenant/conversation
          const params = new URLSearchParams(window.location.search);
          const tenantParam = params.get('tenant') || '';

          if (landlordConversations.length > 0) {
            let matched = landlordConversations[0];
            if (tenantParam) {
              const found = landlordConversations.find(c => c.student && c.student.full_name && c.student.full_name.toLowerCase().includes(tenantParam.toLowerCase()));
              if (found) matched = found;
            }
            if (!activeConversationId) {
              selectConversation(matched.conversation_id, matched);
            }
          } else {
            container.innerHTML = `<div style="padding: 30px; text-align: center; color: #64748B;">No active conversations.</div>`;
          }
        })
        .catch(err => {
          console.error('Error loading conversations:', err);
          container.innerHTML = `<div style="padding: 20px; text-align: center; color: #EF4444;">Error loading conversations.</div>`;
        });
    }

    function renderConversationsList(list) {
      const container = document.getElementById('conversations-list-container');
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div style="padding: 20px; text-align: center; color: #64748B;">No conversations found.</div>`;
        return;
      }

      container.innerHTML = list.map(c => {
        const studentName = c.student ? c.student.full_name : 'Student';
        const initials = getInitials(studentName);
        const propTitle = c.property_title ? escapeHtml(c.property_title) : 'Rental Listing';
        const lastMsgText = c.last_message ? escapeHtml(c.last_message.message_text) : 'Started conversation';
        const isSelected = (c.conversation_id === activeConversationId);

        return `
          <div id="conv-item-${c.conversation_id}" 
               style="padding: 14px 20px; border-bottom: 1px solid #F1F5F9; cursor: pointer; display: flex; gap: 12px; align-items: center; ${isSelected ? 'background: #EFF6FF; border-left: 3px solid #2563EB;' : 'background: #fff;'}" 
               onclick="selectConversation(${c.conversation_id})">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: #2563EB; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">
              ${initials}
            </div>
            <div style="overflow: hidden; flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 14px; font-weight: 700; color: #0F172A;">${escapeHtml(studentName)}</span>
              </div>
              <div style="font-size: 12px; color: #2563EB; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${propTitle}</div>
              <div style="font-size: 12px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${lastMsgText}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectConversation(cid, convData = null) {
      activeConversationId = cid;

      if (!convData) {
        convData = landlordConversations.find(c => c.conversation_id === cid);
      }

      // Highlight in list
      landlordConversations.forEach(c => {
        const item = document.getElementById('conv-item-' + c.conversation_id);
        if (item) {
          if (c.conversation_id === cid) {
            item.style.background = '#EFF6FF';
            item.style.borderLeft = '3px solid #2563EB';
          } else {
            item.style.background = '#fff';
            item.style.borderLeft = 'none';
          }
        }
      });

      if (convData && convData.student) {
        document.getElementById('active-chat-avatar').innerText = getInitials(convData.student.full_name);
        document.getElementById('active-chat-name').innerText = convData.student.full_name;
        document.getElementById('active-chat-sub').innerText = '● Tenant · ' + (convData.property_title || 'Rental Unit');
      }

      loadMessages(cid, false);
    }

    function loadMessages(cid, isSilent = false) {
      const container = document.getElementById('chat-messages-container');
      if (!container) return;

      fetch('../../backend/landlord/messages.php?conversation_id=' + cid)
        .then(res => res.json())
        .then(result => {
          if (!result || !result.success) {
            if (!isSilent) container.innerHTML = `<div style="text-align: center; color: #EF4444; padding: 20px;">Failed to load messages.</div>`;
            return;
          }

          if (result.data && result.data.current_user_id) {
            activeLandlordUserId = parseInt(result.data.current_user_id);
          }

          const msgs = result.data.messages || [];
          if (msgs.length === 0) {
            if (!isSilent) container.innerHTML = `<div style="text-align: center; color: #64748B; padding: 30px;">No messages yet. Send a message to start the conversation!</div>`;
            return;
          }

          const isAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

          container.innerHTML = msgs.map(m => {
            const isMe = activeLandlordUserId > 0 ? (parseInt(m.sender_id) === parseInt(activeLandlordUserId)) : false;
            return `
              <div style="align-self: ${isMe ? 'flex-end' : 'flex-start'}; max-width: 70%; background: ${isMe ? '#2563EB' : '#fff'}; color: ${isMe ? '#fff' : '#0F172A'}; ${isMe ? '' : 'border: 1px solid #E2E8F0;'} padding: 12px 16px; border-radius: ${isMe ? '16px 16px 4px 16px' : '16px 16px 16px 4px'}; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                <p style="margin: 0 0 4px; font-size: 13.5px;">${escapeHtml(m.message_text)}</p>
                <div style="font-size: 10px; color: ${isMe ? 'rgba(255,255,255,0.7)' : '#94A3B8'}; text-align: right;">${escapeHtml(m.sent_at || '')}</div>
              </div>
            `;
          }).join('');

          if (!isSilent || isAtBottom) {
            container.scrollTop = container.scrollHeight;
          }
        })
        .catch(err => {
          if (!isSilent) console.error('Error loading messages:', err);
        });
    }

    function handleSendLandlordMessage(e) {
      e.preventDefault();
      if (!activeConversationId) {
        alert('Please select a conversation first.');
        return;
      }

      const input = document.getElementById('landlord-chat-input');
      const text = input.value.trim();
      if (!text) return;

      fetch('../../backend/landlord/messages.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: activeConversationId, message_text: text })
      })
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          input.value = '';
          loadMessages(activeConversationId, false);
          loadLandlordConversations();
        } else {
          if (typeof showToast === 'function') showToast(result.message || 'Failed to send message', 'error');
          else alert(result.message || 'Failed to send message');
        }
      })
      .catch(err => console.error('Send message error:', err));
    }

    function filterConversations() {
      const query = document.getElementById('search-tenant-input').value.toLowerCase();
      const filtered = landlordConversations.filter(c => {
        const name = c.student ? c.student.full_name.toLowerCase() : '';
        const prop = c.property_title ? c.property_title.toLowerCase() : '';
        return name.includes(query) || prop.includes(query);
      });
      renderConversationsList(filtered);
    }

    function getInitials(name) {
      if (!name) return 'TN';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
